<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen · Gestión de stock</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/resumen.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Gestión de stock</span>
      <nav class="nav">
        <a href="index.html">Productos</a>
        <a href="proveedores.html">Proveedores</a>
        <a href="categorias.html">Categorías</a>
        <a href="resumen.html" class="active">Resumen</a>
      </nav>
    </div>
  </header>

  <div id="message" class="message" hidden></div>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Resumen</h1>
        <p class="subtitle">Consulta de productos con su categoría y proveedor, con filtros.</p>
      </div>
    </div>

    <section class="card">
      <h2>Filtros</h2>
      <form id="filter-form" class="form-grid" novalidate>
        <label class="field span-2">Producto
          <input name="productname" type="text" placeholder="Parte del nombre…">
        </label>
        <label class="field">Categoría
          <select name="categoryname">
            <option value="">Todas</option>
          </select>
        </label>
        <label class="field">Descontinuado
          <select name="discontinued">
            <option value="">Todos</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </label>

        <label class="field">Stock desde
          <input name="stockmax" type="number" step="1">
        </label>
        <label class="field">Stock hasta
          <input name="stockmin" type="number" step="1">
        </label>
        <label class="field">Precio desde
          <input name="pricemax" type="number" step="0.01">
        </label>
        <label class="field">Precio hasta
          <input name="pricemin" type="number" step="0.01">
        </label>

        <div class="form-actions">
          <button type="button" id="btn-clear" class="btn">Limpiar</button>
          <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <span id="count" class="muted"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="num">ID</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Proveedor</th>
              <th class="num">Precio</th>
              <th class="num">Stock</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="7" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
